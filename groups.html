
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TELESUPAR Groups</title>

<style>
:root {
  --bg:#090d16;
  --card:#111827;
  --soft:#1e293b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#6366f1;
  --border:rgba(255,255,255,.08);
}
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}
body {
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
.app {
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}
.header {
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(9,13,22,.95);
  backdrop-filter:blur(15px);
  padding:17px;
  border-bottom:1px solid var(--border);
}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand {
  font-size:21px;
  font-weight:900;
  background:linear-gradient(120deg,#60a5fa,#a78bfa,#ec4899);
  -webkit-background-clip:text;
  color:transparent;
}
.back {
  color:#cbd5e1;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 13px;
  text-decoration:none;
  font-size:13px;
}
.heading {
  margin-top:23px;
}
.heading h1 {
  font-size:25px;
  margin-bottom:6px;
}
.heading p {
  color:var(--muted);
  font-size:13px;
}
.actions {
  display:flex;
  gap:10px;
  margin-top:20px;
}
.action-btn {
  flex:1;
  padding:13px 8px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  color:white;
  font-weight:700;
  cursor:pointer;
}
.action-btn.primary {
  background:linear-gradient(120deg,#4f46e5,#9333ea);
  border:0;
}
.search {
  margin:17px 15px;
}
.search input {
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  padding:15px;
  border-radius:14px;
  color:white;
  outline:none;
  font-size:14px;
}
.section {
  padding:5px 16px;
}
.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.section-title h3 {
  font-size:16px;
}
.section-title span {
  color:var(--muted);
  font-size:12px;
}
.room-list {
  display:flex;
  flex-direction:column;
}
.room-card {
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.room-avatar {
  width:52px;
  height:52px;
  flex-shrink:0;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:23px;
  background:linear-gradient(135deg,#2563eb,#9333ea);
}
.room-info {
  flex:1;
  min-width:0;
}
.room-info h4 {
  font-size:15px;
  margin-bottom:6px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.room-info p {
  color:var(--muted);
  font-size:12px;
}
.room-tag {
  font-size:10px;
  color:#a5b4fc;
  background:#312e81;
  padding:6px 9px;
  border-radius:20px;
}
.empty {
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
}
.empty-icon {
  font-size:43px;
  margin-bottom:14px;
}
.empty h3 {
  color:white;
  margin-bottom:8px;
}
#room-view {
  display:none;
}
.hidden {
  display:none!important;
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="top">
      <div class="brand">TELESUPAR</div>
      <a href="index.html" class="back">← Back</a>
    </div>

    <div class="heading">
      <h1>Groups</h1>
      <p>Connect, communicate and build communities.</p>
    </div>

    <div class="actions">
      <button class="action-btn primary" id="create-group">
        ＋ Create Group
      </button>

      <button class="action-btn" id="discover-groups">
        Explore Groups
      </button>
    </div>

  </header>

  <main id="groups-view">

    <div class="search">
      <input
        type="search"
        id="group-search"
        placeholder="Search groups..."
      >
    </div>

    <section class="section">

      <div class="section-title">
        <h3>My Groups</h3>
        <span id="group-count">0 Groups</span>
      </div>

      <div class="room-list" id="groups-list">

        <div class="empty">
          <div class="empty-icon">👥</div>
          <h3>Loading Groups</h3>
          <p>Your communities will appear here.</p>
        </div>

      </div>

    </section>

  </main>

  <main id="room-view"></main>

</div>

<script>
window.TS_ROOM_PAGE = "group";
</script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="groups.js"></script>

</body>
</html>
